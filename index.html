<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Instrument Studio V1</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
</head>
<body>

    <div id="app">

        <h1>Synth Instrument Studio V1</h1>

        <button id="startBtn">Start Audio</button>

        <div id="keymap">
            A = C4 |
            S = D4 |
            D = E4 |
            F = F4 |
            G = G4 |
            H = A4 |
            J = B4 |
            K = C5
        </div>

        <div class="control">
            <label for="waveform">Waveform</label>

            <select id="waveform">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>

        <div class="control">
            <label for="attack">Attack</label>

            <input
                id="attack"
                type="range"
                min="0"
                max="2"
                step="0.01"
                value="0.05"
            >

            <span id="attackValue">0.05</span>
        </div>

        <div class="control">
            <label for="decay">Decay</label>

            <input
                id="decay"
                type="range"
                min="0"
                max="2"
                step="0.01"
                value="0.2"
            >

            <span id="decayValue">0.2</span>
        </div>

        <div class="control">
            <label for="sustain">Sustain</label>

            <input
                id="sustain"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.6"
            >

            <span id="sustainValue">0.6</span>
        </div>

        <div class="control">
            <label for="release">Release</label>

            <input
                id="release"
                type="range"
                min="0"
                max="5"
                step="0.01"
                value="1"
            >

            <span id="releaseValue">1</span>
        </div>

        <div class="control">
            <label for="duration">Duration</label>

            <input
                id="duration"
                type="range"
                min="0.1"
                max="5"
                step="0.1"
                value="1"
            >

            <span id="durationValue">1</span>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
