<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Instrument Studio V1</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
</head>
<body>

    <div id="app">

        <h1>Synth Instrument Studio V1</h1>

        <div class="transport">
            <button type="button" id="startBtn">Start Audio</button>
            <button type="button" id="recordBtn">Record</button>
            <button type="button" id="playBtn">Play</button>
            <button type="button" id="pauseBtn">Pause</button>
            <button type="button" id="stopBtn">Stop</button>
            <button type="button" id="undoBtn" disabled>Undo</button>
            <button type="button" id="redoBtn" disabled>Redo</button>
            <button type="button" id="loadBtn">Load</button>
            <button type="button" id="importBtn">Import</button>

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none;"
>
        </div>

        <h2>Project</h2>

<div class="control">
    <label for="projectName">Name</label>
    <input
        id="projectName"
        type="text"
        value="Untitled Project"
    >
</div>

<div class="control">
    <label for="projectDescription">Description</label>
    <textarea
        id="projectDescription"
        rows="3"
    ></textarea>
</div>

<div class="transport">
    <button type="button" id="saveBtn">
        Save
    </button>

    <button type="button" id="downloadBtn">
        Download
    </button>

    <button type="button" id="copyBtn">
        Copy Selected Memory JSON
    </button>
</div>

<section class="cell-memory">
    <h2>Cell Memory</h2>
    <div id="cellMemoryBank" class="cell-memory-bank"></div>
    <div class="cell-transfer-controls">
        <label for="saveCellSelect">Save selection to</label>
        <select id="saveCellSelect"></select>
        <button type="button" id="saveSelectionBtn">Save Selection to Cell</button>

        <label for="renameCellInput">Cell name</label>
        <input id="renameCellInput" type="text" maxlength="40" placeholder="Rename selected Cell">
        <button type="button" id="renameCellBtn">Rename Selected Cell</button>

        <label for="cellSourceSelect">Copy from</label>
        <select id="cellSourceSelect"></select>
        <label for="cellTargetSelect">Copy to</label>
        <select id="cellTargetSelect"></select>
        <button type="button" id="copyCellContentsBtn">Copy Memory</button>

        <label for="timelineDestinationTick">Destination start tick</label>
        <input id="timelineDestinationTick" type="number" min="0" step="1" value="0">
        <button type="button" id="pasteCellMemoryBtn">Paste Memory to Timeline</button>
        <label for="repeatCellCount">Repeat count</label>
        <input id="repeatCellCount" type="number" min="1" step="1" value="4">
        <button type="button" id="repeatCellBtn">Repeat Cell on Timeline</button>
        <button type="button" id="moveTimelineSelectionBtn">Move Timeline Selection</button>
        <button type="button" id="deleteTimelineSelectionBtn">Delete Timeline Selection</button>
        <button type="button" id="clearCellMemoryBtn">Clear Selected Memory</button>
        <output id="cellActionStatus" aria-live="polite"></output>
    </div>
</section>

<section class="mixer-panel" aria-labelledby="mixerHeading">
    <h2 id="mixerHeading">Mixer</h2>
    <div id="mixerControls" class="mixer-controls"></div>
</section>

        <div id="keymap">
            Q=C3 &nbsp; 2=C#3<br>
            W=D3 &nbsp; 3=D#3<br>
            E=E3<br>
            R=F3 &nbsp; 5=F#3<br>
            T=G3 &nbsp; 6=G#3<br>
            Y=A3 &nbsp; 7=A#3<br>
            U=B3
        </div>

        <section class="bank1-controller" aria-labelledby="bank1Heading">
            <h2 id="bank1Heading">Bank 1</h2>
            <div class="control">
                <label for="bank1Instrument">Instrument</label>
                <select id="bank1Instrument">
                    <option value="sine">Sine</option>
                    <option value="square">Square</option>
                    <option value="saw">Saw</option>
                    <option value="triangle">Triangle</option>
                    <option value="noise">Noise</option>
                    <option value="drumkit">Drum Kit</option>
                </select>
            </div>
            <div class="bank1-octave-control">
                <span>Octave</span>
                <button type="button" id="bank1OctaveDown" aria-label="Lower Bank 1 octave">-</button>
                <output id="bank1OctaveValue" aria-live="polite">4</output>
                <button type="button" id="bank1OctaveUp" aria-label="Raise Bank 1 octave">+</button>
                <span id="bank1Range" aria-live="polite">C4-B4</span>
            </div>
            <label class="bank-coupling-control">
                <input type="checkbox" id="bankCoupleToggle">
                Couple Banks 1-3 (Bank 1 controls all)
            </label>
            <div id="bank1DrumSlots" class="bank1-drum-slots" hidden></div>
        </section>

        <section id="bank23Controller" class="bank-controller" aria-labelledby="bank23Heading">
            <h2 id="bank23Heading">Banks 2/3 — Linked 24-Key Range</h2>
            <div class="control">
                <label for="bank23Instrument">Instrument</label>
                <select id="bank23Instrument">
                    <option value="sine">Sine</option>
                    <option value="square">Square</option>
                    <option value="saw">Saw</option>
                    <option value="triangle">Triangle</option>
                    <option value="noise">Noise</option>
                </select>
            </div>
            <div class="bank1-octave-control">
                <span>Octave</span>
                <button type="button" id="bank23OctaveDown" aria-label="Lower Banks 2 and 3 octave">-</button>
                <output id="bank23OctaveValue" aria-live="polite">3</output>
                <button type="button" id="bank23OctaveUp" aria-label="Raise Banks 2 and 3 octave">+</button>
                <span id="bank23Range" aria-live="polite">C3-B4</span>
            </div>
        </section>

        <div class="control">
            <label for="attack">Attack</label>
            <input
                id="attack"
                type="range"
                min="0"
                max="2"
                step="0.01"
                value="0.05"
            >
            <span id="attackValue">0.05</span>
        </div>

        <div class="control">
            <label for="decay">Decay</label>
            <input
                id="decay"
                type="range"
                min="0"
                max="2"
                step="0.01"
                value="0.2"
            >
            <span id="decayValue">0.2</span>
        </div>

        <div class="control">
            <label for="sustain">Sustain</label>
            <input
                id="sustain"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.6"
            >
            <span id="sustainValue">0.6</span>
        </div>

        <div class="control">
            <label for="release">Release</label>
            <input
                id="release"
                type="range"
                min="0"
                max="5"
                step="0.01"
                value="1"
            >
            <span id="releaseValue">1</span>
        </div>

        <h2>Timing Ribbon</h2>

<div id="ribbon"></div>

        </div>

        <div id="piano" aria-label="36-key performance keyboard">
            <section class="piano-bank" aria-labelledby="pianoBank1Heading">
                <h3 id="pianoBank1Heading">Bank 1</h3>
                <div class="black-row">
                    <button type="button" class="black-key" data-key="2">2</button>
                    <button type="button" class="black-key" data-key="3">3</button>
                    <div class="black-spacer"></div>
                    <button type="button" class="black-key" data-key="5">5</button>
                    <button type="button" class="black-key" data-key="6">6</button>
                    <button type="button" class="black-key" data-key="7">7</button>
                </div>
                <div class="white-row">
                    <button type="button" class="white-key" data-key="q">Q</button>
                    <button type="button" class="white-key" data-key="w">W</button>
                    <button type="button" class="white-key" data-key="e">E</button>
                    <button type="button" class="white-key" data-key="r">R</button>
                    <button type="button" class="white-key" data-key="t">T</button>
                    <button type="button" class="white-key" data-key="y">Y</button>
                    <button type="button" class="white-key" data-key="u">U</button>
                </div>
            </section>

            <section class="piano-bank" aria-labelledby="pianoBank2Heading">
                <h3 id="pianoBank2Heading">Bank 2</h3>
                <div class="black-row">
                    <button type="button" class="black-key" data-key="9">9</button>
                    <button type="button" class="black-key" data-key="0">0</button>
                    <div class="black-spacer"></div>
                    <button type="button" class="black-key" data-key="=">=</button>
                    <button type="button" class="black-key" data-key="s">S</button>
                    <button type="button" class="black-key" data-key="d">D</button>
                </div>
                <div class="white-row">
                    <button type="button" class="white-key" data-key="i">I</button>
                    <button type="button" class="white-key" data-key="o">O</button>
                    <button type="button" class="white-key" data-key="p">P</button>
                    <button type="button" class="white-key" data-key="[">[</button>
                    <button type="button" class="white-key" data-key="z" aria-label="Bank 2 G note, Z or right bracket">Z / ]</button>
                    <button type="button" class="white-key" data-key="x">X</button>
                    <button type="button" class="white-key" data-key="c">C</button>
                </div>
            </section>

            <section class="piano-bank" aria-labelledby="pianoBank3Heading">
                <h3 id="pianoBank3Heading">Bank 3</h3>
                <div class="black-row">
                    <button type="button" class="black-key" data-key="g">G</button>
                    <button type="button" class="black-key" data-key="h">H</button>
                    <div class="black-spacer"></div>
                    <button type="button" class="black-key" data-key="k">K</button>
                    <button type="button" class="black-key" data-key="l">L</button>
                    <button type="button" class="black-key" data-key=";">;</button>
                </div>
                <div class="white-row">
                    <button type="button" class="white-key" data-key="v">V</button>
                    <button type="button" class="white-key" data-key="b">B</button>
                    <button type="button" class="white-key" data-key="n">N</button>
                    <button type="button" class="white-key" data-key="m">M</button>
                    <button type="button" class="white-key" data-key=",">,</button>
                    <button type="button" class="white-key" data-key=".">.</button>
                    <button type="button" class="white-key" data-key="/">/</button>
                </div>
            </section>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
