<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Instrument Studio V1</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
</head>
<body>

    <div id="app">

        <h1>Synth Instrument Studio V1</h1>

        <button id="startBtn">Start Audio</button>

        <div id="keymap">
            Q=C3  2=C#3

            W=D3  3=D#3

            E=E3

            R=F3  5=F#3

            T=G3  6=G#3

            Y=A3  7=A#3

            U=B3
        </div>

        <div class="control">
            <label for="waveform">Waveform</label>

            <select id="waveform">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>

        <div class="control">
            <label for="attack">Attack</label>

            <input
                id="attack"
                type="range"
                min="0"
                max="2"
                step="0.01"
                value="0.05"
            >

            <span id="attackValue">0.05</span>
        </div>

        <div class="control">
            <label for="decay">Decay</label>

            <input
                id="decay"
                type="range"
                min="0"
                max="2"
                step="0.01"
                value="0.2"
            >

            <span id="decayValue">0.2</span>
        </div>

        <div class="control">
            <label for="sustain">Sustain</label>

            <input
                id="sustain"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.6"
            >

            <span id="sustainValue">0.6</span>
        </div>

        <div class="control">
            <label for="release">Release</label>

            <input
                id="release"
                type="range"
                min="0"
                max="5"
                step="0.01"
                value="1"
            >

            <span id="releaseValue">1</span>
        </div>

        <div class="control">
            <label for="duration">Duration</label>

            <input
                id="duration"
                type="range"
                min="0.1"
                max="5"
                step="0.1"
                value="1"
            >

            <span id="durationValue">1</span>
        </div>

        <h2>Bank 1 • C3 - B3</h2>

        <div id="piano">

            <div class="black-row">
                <button class="black-key" data-key="2">2</button>
                <button class="black-key" data-key="3">3</button>

                <div class="black-spacer"></div>

                <button class="black-key" data-key="5">5</button>
                <button class="black-key" data-key="6">6</button>
                <button class="black-key" data-key="7">7</button>
            </div>

            <div class="white-row">
                <button class="white-key" data-key="q">Q</button>
                <button class="white-key" data-key="w">W</button>
                <button class="white-key" data-key="e">E</button>
                <button class="white-key" data-key="r">R</button>
                <button class="white-key" data-key="t">T</button>
                <button class="white-key" data-key="y">Y</button>
                <button class="white-key" data-key="u">U</button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
